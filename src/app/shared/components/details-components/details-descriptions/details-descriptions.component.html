<div fxLayout="row" class="details-row" *ngIf="character.description != ''">
  <div fxFlex="100">
    <h4>{{text.getText().descriptionLabel}}</h4>
    {{character.description}}
  </div>
</div>

<div class="details-row meta-row">
  <div>
    <h4>{{text.getText().groupTypeLabel}}</h4>
    {{character.groupType}}
  </div>

  <div>
    <h4>{{text.getText().groupLabel}}</h4>
    {{character.group}}
  </div>

  <div *ngIf="character.status">
    <h4>{{text.getText().statusLabel}}</h4>
    {{character.status}}
  </div>
</div>
