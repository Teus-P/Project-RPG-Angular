<div fxLayout="row" fxLayoutGap="20">
  <div fxFlex="35">
    <app-skirmish-characters-list></app-skirmish-characters-list>
  </div>
  <div fxFlex="65" class="tab" [class.sticky-map]="isMapTabActive">
    <mat-tab-group [dynamicHeight]="true" (selectedIndexChange)="isMapTabActive = $event === 1">
      <mat-tab [label]="text.getText().characterLabel">
        <router-outlet></router-outlet>
      </mat-tab>
      <mat-tab [label]="text.getText().mapLabel">
        <app-skirmish-battlefield></app-skirmish-battlefield>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
