<br>
<div class="battlefield" #battlefield>
  <button type="button" class="labels-toggle" [class.active]="showLabels"
          (mousedown)="$event.stopPropagation()" (click)="toggleLabels()">
    {{ text.getText().labelsLabel }}
  </button>

  <div *ngFor="let token of tokens"
       class="token-holder"
       [ngClass]="{
       'dead-character': token.isDead,
       'dragging': draggedToken === token,
       'clicked': clickedToken === token,
       'label-shown': showLabels && getLabelPlacement(token) !== null
       }"
       [ngStyle]="{
       'top.px': token.y,
       'left.px': token.x
       }"
       [title]="token.name"
       (mousedown)="onDragStart($event, token)"
       (click)="onTokenClick($event, token)"
  >
    <div class="token"
         [style.background-color]="'rgb(' + token.colorR + ',' + token.colorG + ',' + token.colorB + ')'">
      {{ token.shortName }}
    </div>
    <span class="token-name" [class.above]="isLabelAbove(token)">{{ token.name }}</span>
  </div>


  <svg *ngFor="let token of tokens" class="engaged">
    <line
      *ngIf="token.meleeTargetName"
      [attr.x1]="token.x + 25 + getEngagedLineOffset(token, true)"
      [attr.y1]="token.y + 25 + getEngagedLineOffset(token, false)"
      [attr.x2]="getTargetToken(token)!.x + 25 + getEngagedLineOffset(token, true)"
      [attr.y2]="getTargetToken(token)!.y + 25 + getEngagedLineOffset(token, false)"
      [attr.stroke]="'rgb(' + token.colorR + ',' + token.colorG + ',' + token.colorB + ')'"
      stroke-width="2"
      stroke-dasharray="4"
    />
  </svg>

</div>
