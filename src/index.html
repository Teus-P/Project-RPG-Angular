<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ProjectRPGAngular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography mat-app-background">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="wave"/>
        <feDisplacementMap in="SourceGraphic" in2="wave" scale="10" xChannelSelector="R" yChannelSelector="G" result="w"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="2" result="fray"/>
        <feDisplacementMap in="w" in2="fray" scale="5" xChannelSelector="G" yChannelSelector="R"/>
      </filter>
    </defs>
  </svg>
  <app-root></app-root>
</body>
</html>
